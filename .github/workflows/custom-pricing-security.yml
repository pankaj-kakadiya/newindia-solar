name: Custom pricing security
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/custom-pricing.test.mjs'
      - 'tests/fixtures/custom-pricing-schema.sql'
      - 'package*.json'
      - '.github/workflows/custom-pricing-security.yml'
  push:
    branches: [main, fix/custom-configuration-pricing]
    paths:
      - 'supabase/**'
      - 'tests/custom-pricing.test.mjs'
      - 'tests/fixtures/custom-pricing-schema.sql'
      - 'package*.json'
      - '.github/workflows/custom-pricing-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:custom-pricing
