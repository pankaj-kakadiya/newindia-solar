name: Buyer and admin login Lighthouse
on:
  pull_request:
    paths: ['app/**', 'components/**', 'next.config.mjs', '.github/workflows/lighthouse.yml', 'scripts/lighthouse-audit.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Audit production build
        run: |
          npm start > /tmp/newindia-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/admin/login > /dev/null; then break; fi
            sleep 2
          done
          node scripts/lighthouse-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 14
