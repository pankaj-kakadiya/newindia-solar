name: Published builder read-only check
on:
  push:
    branches: [main]
    paths:
      - components/ConfiguratorBuilder.tsx
      - components/ComponentSprite.tsx
      - lib/builder-buyer.ts
      - app/builder-buyer.css
      - .github/workflows/builder-live-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test@1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Wait for Hostinger and inspect without submitting forms
        run: node tests/builder-remote-smoke.cjs https://newindiasolar.com production --wait
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-builder-verification
          path: test-results/production/
          retention-days: 7
